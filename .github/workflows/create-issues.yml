name: Create project issues
on:
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  issues:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Publish prepared issues without duplicating titles
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-issues.mjs "$GITHUB_REPOSITORY"
